<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Curtis Bragdon - schedule a truck stop, request tools, or ask any questions.">
  <title>Contact - Curtis Bragdon</title>
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact Curtis Bragdon">
  <meta property="og:description" content="Schedule a truck stop, request tools, or get in touch with Curtis Bragdon's Snap-on franchise.">
  <meta property="og:image" content="https://www.curtbrag.com/assets/logo_icon.png">
  <meta property="og:url" content="https://www.curtbrag.com/contact">
  <link rel="icon" type="image/png" href="/assets/truck_favicon.png">
  <link rel="apple-touch-icon" href="/assets/truck_favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--brand), #b91c22);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 2rem;
    }
    .nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .nav a:hover {
      background: var(--brand);
      border-color: var(--brand);
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .contact-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    .contact-box p {
      color: var(--muted);
      margin: 0 0 1.5rem;
      line-height: 1.6;
    }
    .quick-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .quick-contact a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .quick-contact a:hover,
    .quick-contact .copy-btn:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .quick-contact .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .quick-contact .copy-btn.copied {
      border-color: #22c55e;
      color: #22c55e;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: -0.5rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.8rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--brand);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #c91a20;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    button .spinner {
      display: none;
      animation: spin 1s linear infinite;
    }
    button.loading .spinner {
      display: inline-block;
    }
    button.loading .btn-text {
      display: none;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* Focus states */
    input:focus, textarea:focus {
      box-shadow: 0 0 0 2px rgba(237, 35, 42, 0.2);
    }
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a {
      color: var(--brand);
      text-decoration: none;
    }
    /* Anchors for direct linking */
    #schedule, #request, #warranty { scroll-margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fa-solid fa-envelope"></i> Contact Curtis</h1>
  </div>

  <nav class="nav">
    <a href="/"><i class="fa-solid fa-home"></i> Home</a>
    <a href="/shop"><i class="fa-solid fa-shopping-cart"></i> Shop</a>
    <a href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a>
  </nav>

  <div class="container">
    <div class="contact-box">
      <p>Have a question about tools, need a custom order, or want to schedule a stop? Fill out the form below or use the quick contact options.</p>

      <div class="quick-contact">
        <a href="tel:+17814170692"><i class="fa-solid fa-phone"></i> Call</a>
        <a href="sms:+17814170692"><i class="fa-solid fa-comment-sms"></i> Text</a>
        <a href="mailto:curtbrag@yahoo.com"><i class="fa-solid fa-envelope"></i> Email</a>
        <a href="/zelle.html"><i class="fa-solid fa-dollar-sign"></i> Zelle</a>
        <button type="button" class="copy-btn" id="copyBtn" title="Copy phone number">
          <i class="fa-solid fa-copy" id="copyIcon"></i> <span id="copyText">Copy #</span>
        </button>
      </div>

      <a id="schedule"></a>
      <a id="request"></a>
      <a id="warranty"></a>

      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
        <input type="hidden" name="form-name" value="contact">
        <p style="display:none">
          <label>Don't fill this out if you're human: <input name="bot-field"></label>
        </p>

        <label for="name">Your Name</label>
        <input id="name" type="text" name="name" required>

        <label for="email">Your Email</label>
        <input id="email" type="email" name="email" required>

        <label for="subject">Subject</label>
        <input id="subject" type="text" name="subject" placeholder="Schedule Stop, Tool Request, Warranty, etc.">

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="How can I help you?" required></textarea>

        <button type="submit" id="submitBtn">
          <i class="fa-solid fa-spinner spinner"></i>
          <span class="btn-text"><i class="fa-solid fa-paper-plane"></i> Send Message</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Form submit loading state
    const form = document.querySelector('form');
    const submitBtn = document.getElementById('submitBtn');
    form.addEventListener('submit', function() {
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
    });

    // Copy phone number
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('781-417-0692');
        copyBtn.classList.add('copied');
        copyIcon.className = 'fa-solid fa-check';
        copyText.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyIcon.className = 'fa-solid fa-copy';
          copyText.textContent = 'Copy #';
        }, 2000);
      } catch (err) {
        copyText.textContent = 'Failed';
        setTimeout(() => { copyText.textContent = 'Copy #'; }, 2000);
      }
    });
  </script>

  <div class="footer">
    <p><a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></p>
    <p>&copy; 2025 Curtis Bragdon. All rights reserved.</p>
  </div>
</body>
</html>
