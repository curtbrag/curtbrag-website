# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Host-based routing: teathetruth.com serves Tea's site via edge function
[[edge_functions]]
  function = "tea-router"
  path = "/*"

# curtbrag.com/teathetruth still works too
[[redirects]]
  from = "/teathetruth"
  to = "/teathetruth/index.html"
  status = 200

[[redirects]]
  from = "/teathetruth/"
  to = "/teathetruth/index.html"
  status = 200

[[redirects]]
  from = "/cluster"
  to = "/cluster/index.html"
  status = 200

[[redirects]]
  from = "/cluster/"
  to = "/cluster/index.html"
  status = 200

[[redirects]]
  from = "/cluster/eyecandy"
  to = "/cluster/eyecandy.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.auctionnudge.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.auctionnudge.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-src 'self' https://www.auctionnudge.com https://open.spotify.com https://www.youtube.com; frame-ancestors 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/cars/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/snapon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
