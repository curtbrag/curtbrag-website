[functions]
  included_files = ["netlify/functions/swarm-core/job-queue.json"]

# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Host-based routing: teathetruth.com serves Tea's site via edge function
[[edge_functions]]
  function = "tea-router"
  path = "/*"

# curtbrag.com/teathetruth still works too
[[redirects]]
  from = "/teathetruth"
  to = "/teathetruth/index.html"
  status = 200

[[redirects]]
  from = "/teathetruth/"
  to = "/teathetruth/index.html"
  status = 200

[[redirects]]
  from = "/cluster/eyecandy"
  to = "/cluster/eyecandy.html"
  status = 200

[[redirects]]
  from = "/api/agent/*"
  to = "/.netlify/functions/agent-api/:splat"
  status = 200

[[redirects]]
  from = "/api/cluster/*"
  to = "/.netlify/functions/cluster-api/:splat"
  status = 200

# Legacy .html → clean Astro URL redirects
[[redirects]]
  from = "/zelle.html"
  to = "/zelle/"
  status = 301

[[redirects]]
  from = "/yougood.html"
  to = "/yougood/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/thanks.html"
  to = "/thanks/"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/terms.html"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/addyourride.html"
  to = "/addyourride/"
  status = 301

[[redirects]]
  from = "/cars.html"
  to = "/gallery/cars/"
  status = 301

[[redirects]]
  from = "/call.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/sms.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/email.html"
  to = "/"
  status = 301

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.auctionnudge.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.auctionnudge.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https:; frame-src 'self' https://www.auctionnudge.com https://open.spotify.com https://www.youtube.com; frame-ancestors 'none';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/cars/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gallery/snapon/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/cluster"
  to = "/.netlify/functions/swarm-core"
  status = 200
  force = true

[[redirects]]
  from = "/api/cluster-api"
  to = "/.netlify/functions/swarm-core"
  status = 200
  force = true
