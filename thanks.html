<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Curtis Bragdon</title>
  <meta name="description" content="Thank you for contacting Curtis Bragdon. We'll get back to you soon.">
  <meta name="theme-color" content="#ed232a">
  <link rel="icon" type="image/png" href="/assets/truck_favicon.png">
  <link rel="apple-touch-icon" href="/assets/truck_favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thanks-container {
      max-width: 500px;
      margin: 2rem;
      padding: 2.5rem;
      text-align: center;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      color: var(--brand);
    }
    h1 i {
      margin-right: 0.5rem;
    }
    p {
      font-size: 1.1rem;
      color: var(--muted);
      margin: 0 0 1.5rem;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      background: var(--brand);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover {
      background: #c91a20;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.secondary {
      background: var(--bg);
      border: 1px solid var(--border);
    }
    a.secondary:hover {
      border-color: var(--brand);
      background: rgba(237, 35, 42, 0.1);
    }
    .contact-note {
      font-size: 0.85rem;
      margin-top: 1.5rem;
      margin-bottom: 0;
    }
    .contact-note strong {
      color: var(--brand);
    }
  </style>
</head>
<body>
  <div class="thanks-container">
    <h1><i class="fa-solid fa-check-circle"></i> Thank You!</h1>
    <p>Your message was sent successfully. I'll get back to you as soon as possible.</p>
    <div class="btn-group">
      <a href="/"><i class="fa-solid fa-home"></i> Return Home</a>
      <a href="/gallery" class="secondary"><i class="fa-solid fa-images"></i> Browse Gallery</a>
      <a href="/shop" class="secondary"><i class="fa-solid fa-shopping-cart"></i> Card Shop</a>
    </div>
    <p class="contact-note">Need immediate help? Call or text <strong>781-417-0692</strong></p>
  </div>
</body>
</html>
