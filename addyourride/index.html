<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Your Ride - Curtis Bragdon</title>
  <meta name="description" content="Share your ride or card collection with Curtis Bragdon. Submit details and photos to be featured.">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Add Your Ride - Curtis Bragdon">
  <meta property="og:description" content="Submit your car, truck, or collection to be featured on Curtis Bragdon's gallery!">
  <meta property="og:image" content="https://www.curtbrag.com/assets/logo_icon.png">
  <meta property="og:url" content="https://www.curtbrag.com/addyourride">
  <link rel="icon" type="image/png" href="/assets/truck_favicon.png">
  <link rel="apple-touch-icon" href="/assets/truck_favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--brand), #b91c22);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .header h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }
    .header p {
      margin: 0;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }
    .nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .nav a:hover, .nav a.active {
      background: var(--brand);
      border-color: var(--brand);
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .form-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
    }
    .form-group label i {
      color: var(--brand);
      margin-right: 0.5rem;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--brand);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-group input[type="file"] {
      padding: 0.5rem;
    }
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .submit-btn:hover {
      background: #c91a20;
    }
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a {
      color: var(--brand);
      text-decoration: none;
    }
    /* Image preview */
    .preview-container {
      margin-top: 0.75rem;
      display: none;
    }
    .preview-container.active {
      display: block;
    }
    .preview-container img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      border: 2px solid var(--border);
    }
    .preview-container .file-info {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    /* Character counter */
    .char-counter {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      margin-top: 0.25rem;
    }
    /* Input focus states */
    .form-group input:focus,
    .form-group textarea:focus {
      box-shadow: 0 0 0 2px rgba(237, 35, 42, 0.2);
    }
    /* Submit button loading state */
    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .submit-btn .spinner {
      display: none;
      animation: spin 1s linear infinite;
    }
    .submit-btn.loading .spinner {
      display: inline-block;
    }
    .submit-btn.loading .btn-text {
      display: none;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fa-solid fa-car-side"></i> Add Your Ride</h1>
    <p>Share your vehicle or card collection with us! We love seeing what you're driving and collecting.</p>
  </div>

  <nav class="nav">
    <a href="/"><i class="fa-solid fa-home"></i> Home</a>
    <a href="/shop"><i class="fa-solid fa-shopping-cart"></i> Shop</a>
    <a href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a>
    <a href="/addyourride" class="active"><i class="fa-solid fa-car-side"></i> Add Your Ride</a>
  </nav>

  <div class="container">
    <div class="form-section">
      <form name="ride-submission" method="POST" data-netlify="true" enctype="multipart/form-data" action="/thanks.html">
        <input type="hidden" name="form-name" value="ride-submission">

        <div class="form-group">
          <label for="name"><i class="fa-solid fa-user"></i> Your Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="type"><i class="fa-solid fa-tag"></i> Submission Type</label>
          <input type="text" id="type" name="type" placeholder="Car, Truck, Motorcycle, Card Collection, etc." required>
        </div>

        <div class="form-group">
          <label for="description"><i class="fa-solid fa-align-left"></i> Description</label>
          <textarea id="description" name="description" placeholder="Tell us about your ride or collection... Year, make, model, mods, or what cards you're showing off!" maxlength="500" required></textarea>
          <div class="char-counter"><span id="charCount">0</span>/500 characters</div>
        </div>

        <div class="form-group">
          <label for="photo"><i class="fa-solid fa-camera"></i> Photo (Max 10MB)</label>
          <input type="file" id="photo" name="photo" accept="image/*" required>
          <div class="preview-container" id="previewContainer">
            <img id="imagePreview" src="" alt="Preview">
            <div class="file-info" id="fileInfo"></div>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <i class="fa-solid fa-spinner spinner"></i>
          <span class="btn-text"><i class="fa-solid fa-paper-plane"></i> Submit Your Ride</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Character counter
    const desc = document.getElementById('description');
    const charCount = document.getElementById('charCount');
    desc.addEventListener('input', () => {
      charCount.textContent = desc.value.length;
    });

    // Image preview
    const photoInput = document.getElementById('photo');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const fileInfo = document.getElementById('fileInfo');

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        // Check file size (10MB max)
        if (file.size > 10 * 1024 * 1024) {
          alert('File is too large. Please select an image under 10MB.');
          photoInput.value = '';
          previewContainer.classList.remove('active');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
          previewContainer.classList.add('active');
          const sizeMB = (file.size / 1024 / 1024).toFixed(2);
          fileInfo.textContent = `${file.name} (${sizeMB} MB)`;
        };
        reader.readAsDataURL(file);
      } else {
        previewContainer.classList.remove('active');
      }
    });

    // Form submit loading state
    const form = document.querySelector('form');
    const submitBtn = document.getElementById('submitBtn');
    form.addEventListener('submit', function() {
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
    });
  </script>

  <div class="footer">
    <p><a href="/">← Back to Curtis Bragdon's World</a></p>
    <p>&copy; 2025 Curtis Bragdon. All rights reserved.</p>
    <p><a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a></p>
  </div>
</body>
</html>
