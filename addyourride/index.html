<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Your Ride - Curtis Bragdon</title>
  <meta name="description" content="Share your ride or card collection with Curtis Bragdon. Submit details and photos to be featured.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--brand), #b91c22);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .header h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
    }
    .header p {
      margin: 0;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }
    .nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .nav a:hover, .nav a.active {
      background: var(--brand);
      border-color: var(--brand);
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .form-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
    }
    .form-group label i {
      color: var(--brand);
      margin-right: 0.5rem;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--brand);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-group input[type="file"] {
      padding: 0.5rem;
    }
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--brand);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .submit-btn:hover {
      background: #c91a20;
    }
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a {
      color: var(--brand);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fa-solid fa-car-side"></i> Add Your Ride</h1>
    <p>Share your vehicle or card collection with us! We love seeing what you're driving and collecting.</p>
  </div>

  <nav class="nav">
    <a href="/"><i class="fa-solid fa-home"></i> Home</a>
    <a href="/shop"><i class="fa-solid fa-shopping-cart"></i> Shop</a>
    <a href="/gallery"><i class="fa-solid fa-image"></i> Gallery</a>
    <a href="/addyourride" class="active"><i class="fa-solid fa-car-side"></i> Add Your Ride</a>
  </nav>

  <div class="container">
    <div class="form-section">
      <form name="ride-submission" method="POST" data-netlify="true" enctype="multipart/form-data">
        <input type="hidden" name="form-name" value="ride-submission">

        <div class="form-group">
          <label for="name"><i class="fa-solid fa-user"></i> Your Name</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="type"><i class="fa-solid fa-tag"></i> Submission Type</label>
          <input type="text" id="type" name="type" placeholder="Car, Truck, Motorcycle, Card Collection, etc." required>
        </div>

        <div class="form-group">
          <label for="description"><i class="fa-solid fa-align-left"></i> Description</label>
          <textarea id="description" name="description" placeholder="Tell us about your ride or collection... Year, make, model, mods, or what cards you're showing off!" required></textarea>
        </div>

        <div class="form-group">
          <label for="photo"><i class="fa-solid fa-camera"></i> Photo</label>
          <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-paper-plane"></i> Submit Your Ride
        </button>
      </form>
    </div>
  </div>

  <div class="footer">
    <p><a href="/">← Back to Curtis Bragdon's World</a></p>
    <p>&copy; 2025 Curtis Bragdon. All rights reserved.</p>
    <p><a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a></p>
  </div>
</body>
</html>
