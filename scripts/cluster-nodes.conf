# Cluster Node Configuration — single source of truth
# Format: name:ip:role[:user]
#   Roles: control-plane, worker (phones), pc
#   user: optional SSH user override (default: 'user' for phones, 'neo' for PCs)

PHONE_NODE_LIST="node1:192.168.1.206:worker node2:192.168.1.207:worker node3:192.168.1.208:worker node4:192.168.1.209:worker node5:192.168.1.210:worker node6:192.168.1.211:worker node7:192.168.1.212:worker node8:192.168.1.213:worker node9:192.168.1.214:worker node10:192.168.1.215:worker"

# PC nodes: name:ip:pc[:ssh-user]
PC_NODE_LIST="nexus-prime:192.168.1.179:pc viki:192.168.1.217:pc skynet:192.168.1.218:pc steamdeck:192.168.1.171:pc:deck"

NODE_LIST="$PHONE_NODE_LIST $PC_NODE_LIST"

ALL_NODES=""
PHONE_NODES=""
PC_NODES=""
CONTROL_PLANE_NODES=""
NODE_COUNT=0

load_node_config() {
  ALL_NODES=""
  PHONE_NODES=""
  PC_NODES=""
  CONTROL_PLANE_NODES=""
  NODE_COUNT=0
  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    rest2="${rest#*:}"
    role="${rest2%%:*}"
    ALL_NODES="${ALL_NODES:+$ALL_NODES }${name}:${ip}"
    NODE_COUNT=$((NODE_COUNT + 1))
    if [ "$role" = "control-plane" ]; then
      CONTROL_PLANE_NODES="${CONTROL_PLANE_NODES:+$CONTROL_PLANE_NODES }${name}:${ip}"
      PHONE_NODES="${PHONE_NODES:+$PHONE_NODES }${name}:${ip}"
    elif [ "$role" = "pc" ]; then
      PC_NODES="${PC_NODES:+$PC_NODES }${name}:${ip}"
    else
      PHONE_NODES="${PHONE_NODES:+$PHONE_NODES }${name}:${ip}"
    fi
  done
}

get_pc_ssh_user() {
  local node_name="$1"
  for entry in $PC_NODE_LIST; do
    name="${entry%%:*}"
    if [ "$name" = "$node_name" ]; then
      rest="${entry#*:*:*:}"
      if [ "$rest" != "$entry" ] && [ -n "$rest" ]; then
        echo "$rest"
        return
      fi
    fi
  done
  echo "neo"
}

get_node_ssh_port() { echo "22"; }

is_pc_node() {
  case " $PC_NODES " in
    *" ${1}:"*) return 0 ;;
    *) return 1 ;;
  esac
}

resolve_ip_from_config() {
  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    if [ "$1" = "$name" ]; then
      echo "$ip"
      return
    fi
  done
  echo "$1"
}
