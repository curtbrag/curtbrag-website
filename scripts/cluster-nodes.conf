# Cluster Node Configuration — single source of truth
# Format: name:ip:role
# Sourced by poll-cluster-commands.sh and push-cluster-status.sh
# Update this file to change node IPs, then run 'update' command to push to all nodes

NODE_LIST="node1:192.168.1.206:control-plane node2:192.168.1.207:worker node3:192.168.1.208:worker node4:192.168.1.209:worker node5:192.168.1.210:worker node6:192.168.1.211:worker node7:192.168.1.212:worker node8:192.168.1.213:worker node9:192.168.1.214:worker node10:192.168.1.215:worker"

# Derived variables (populated by load_node_config)
ALL_NODES=""
PHONE_NODES=""
NODE_COUNT=0

load_node_config() {
  ALL_NODES=""
  PHONE_NODES=""
  NODE_COUNT=0
  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    ALL_NODES="${ALL_NODES:+$ALL_NODES }${name}:${ip}"
    PHONE_NODES="${PHONE_NODES:+$PHONE_NODES }${name}:${ip}"
    NODE_COUNT=$((NODE_COUNT + 1))
  done
}

# Resolve node name to IP from NODE_LIST
resolve_ip_from_config() {
  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    if [ "$1" = "$name" ]; then
      echo "$ip"
      return
    fi
  done
  echo "$1"
}
