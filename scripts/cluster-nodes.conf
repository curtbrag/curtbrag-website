# Cluster Node Configuration — single source of truth
# Format: name:ip:role[:ssh-user]
#   Roles: worker (phones/Termux, SSH port 8022), control-plane (controllers, SSH port 22), pc (SSH port 22)
#   ssh-user: optional override (default: 'user' for workers, 'neo' for pc/control-plane)

# ── Phone workers (Termux, SSH port 8022) ─────────────────────────────────────
# node1=.173  node2=.174  node3=.175  node4=.176
# node5=.177  node6=.191  node7=.253  node8=.254
# .173 and .254: tmux unreliable — always launch via nohup
PHONE_NODE_LIST="node1:192.168.1.173:worker node2:192.168.1.174:worker node3:192.168.1.175:worker node4:192.168.1.176:worker node5:192.168.1.177:worker node6:192.168.1.191:worker node7:192.168.1.253:worker node8:192.168.1.254:worker"

# ── Controllers / PCs (SSH port 22) ──────────────────────────────────────────
# .178 = viki (controller)   .179 = nexus-prime (controller)
# Rule: NEVER run worker start/stop actions on controllers
PC_NODE_LIST="viki:192.168.1.178:control-plane nexus-prime:192.168.1.179:control-plane"

NODE_LIST="$PHONE_NODE_LIST $PC_NODE_LIST"

ALL_NODES=""
PHONE_NODES=""
PC_NODES=""
CONTROL_PLANE_NODES=""
NODE_COUNT=0

load_node_config() {
  ALL_NODES=""
  PHONE_NODES=""
  PC_NODES=""
  CONTROL_PLANE_NODES=""
  NODE_COUNT=0
  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    rest2="${rest#*:}"
    role="${rest2%%:*}"
    ALL_NODES="${ALL_NODES:+$ALL_NODES }${name}:${ip}"
    NODE_COUNT=$((NODE_COUNT + 1))
    if [ "$role" = "control-plane" ]; then
      CONTROL_PLANE_NODES="${CONTROL_PLANE_NODES:+$CONTROL_PLANE_NODES }${name}:${ip}"
      PC_NODES="${PC_NODES:+$PC_NODES }${name}:${ip}"
    elif [ "$role" = "pc" ]; then
      PC_NODES="${PC_NODES:+$PC_NODES }${name}:${ip}"
    else
      PHONE_NODES="${PHONE_NODES:+$PHONE_NODES }${name}:${ip}"
    fi
  done
}

get_pc_ssh_user() {
  local node_name="$1"
  for entry in $PC_NODE_LIST; do
    name="${entry%%:*}"
    if [ "$name" = "$node_name" ]; then
      # Check for 4th colon-delimited field (optional user override)
      rest="${entry#*:*:*:}"
      if [ "$rest" != "$entry" ] && [ -n "$rest" ]; then
        echo "$rest"
        return
      fi
    fi
  done
  echo "neo"
}

# Phones use port 8022 (Termux sshd); controllers/PCs use port 22
get_node_ssh_port() {
  local ip="$1"
  case " $PHONE_NODE_LIST " in
    *":${ip}:"*) echo "8022"; return ;;
  esac
  echo "22"
}

# Returns true (0) if ip is a phone worker node
is_phone_node() {
  case " $PHONE_NODE_LIST " in
    *":${1}:"*) return 0 ;;
    *) return 1 ;;
  esac
}

# Returns true (0) if ip is a PC/controller node
is_pc_node() {
  case " $PC_NODES " in
    *" ${1}:"*) return 0 ;;
    *) return 1 ;;
  esac
}

# Resolve SSH username for a given IP: 'user' for phone workers, 'neo' for controllers/PCs
get_node_ssh_user() {
  case " $PHONE_NODE_LIST " in
    *":${1}:"*) echo "user"; return ;;
  esac
  # For controller/PC nodes check for per-node user override
  for entry in $PC_NODE_LIST; do
    _name="${entry%%:*}"
    _rest="${entry#*:}"
    _ip="${_rest%%:*}"
    if [ "$_ip" = "$1" ]; then
      _tail="${entry#*:*:*:}"
      if [ "$_tail" != "$entry" ] && [ -n "$_tail" ]; then
        echo "$_tail"
        return
      fi
    fi
  done
  echo "neo"
}

resolve_ip_from_config() {
  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    if [ "$1" = "$name" ]; then
      echo "$ip"
      return
    fi
  done
  echo "$1"
}
