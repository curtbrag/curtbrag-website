# Curt Cluster node configuration — canonical 11-node fleet
# Format: name:ip:role:ssh-user
# Roles: worker (Termux phone, SSH 8022), pc (Linux PC, SSH 22)

# ── Phone workers ─────────────────────────────────────────────────────────────
PHONE_NODE_LIST="phone173:192.168.1.173:worker:u0_a191 phone174:192.168.1.174:worker:u0_a191 phone176:192.168.1.176:worker:u0_a191 phone177:192.168.1.177:worker:u0_a191 phone191:192.168.1.191:worker:u0_a191 phone195:192.168.1.195:worker:u0_a191 phone253:192.168.1.253:worker:u0_a191 phone254:192.168.1.254:worker:u0_a191"

# ── Linux PCs / controllers ──────────────────────────────────────────────────
PC_NODE_LIST="Alina:192.168.1.193:pc:neo Nexus:192.168.1.192:pc:neo SteamDeck:192.168.1.166:pc:deck"

NODE_LIST="$PHONE_NODE_LIST $PC_NODE_LIST"

ALL_NODES=""
PHONE_NODES=""
PC_NODES=""
CONTROL_PLANE_NODES=""
NODE_COUNT=0

load_node_config() {
  ALL_NODES=""
  PHONE_NODES=""
  PC_NODES=""
  CONTROL_PLANE_NODES=""
  NODE_COUNT=0

  for entry in $NODE_LIST; do
    name="${entry%%:*}"
    rest="${entry#*:}"
    ip="${rest%%:*}"
    rest="${rest#*:}"
    role="${rest%%:*}"

    ALL_NODES="${ALL_NODES:+$ALL_NODES }${name}:${ip}"
    NODE_COUNT=$((NODE_COUNT + 1))

    case "$role" in
      worker)
        PHONE_NODES="${PHONE_NODES:+$PHONE_NODES }${name}:${ip}"
        ;;
      control-plane)
        CONTROL_PLANE_NODES="${CONTROL_PLANE_NODES:+$CONTROL_PLANE_NODES }${name}:${ip}"
        PC_NODES="${PC_NODES:+$PC_NODES }${name}:${ip}"
        ;;
      pc|*)
        PC_NODES="${PC_NODES:+$PC_NODES }${name}:${ip}"
        ;;
    esac
  done
}

find_node_entry_by_ip() {
  _wanted_ip="$1"
  for _entry in $NODE_LIST; do
    _rest="${_entry#*:}"
    _ip="${_rest%%:*}"
    if [ "$_ip" = "$_wanted_ip" ]; then
      printf '%s\n' "$_entry"
      return 0
    fi
  done
  return 1
}

find_node_entry_by_name() {
  _wanted_name="$1"
  for _entry in $NODE_LIST; do
    _name="${_entry%%:*}"
    if [ "$_name" = "$_wanted_name" ]; then
      printf '%s\n' "$_entry"
      return 0
    fi
  done
  return 1
}

get_node_role() {
  _entry=$(find_node_entry_by_ip "$1" 2>/dev/null || true)
  [ -n "$_entry" ] || { echo "unknown"; return; }
  _rest="${_entry#*:}"
  _rest="${_rest#*:}"
  echo "${_rest%%:*}"
}

get_pc_ssh_user() {
  _entry=$(find_node_entry_by_name "$1" 2>/dev/null || true)
  [ -n "$_entry" ] || { echo "neo"; return; }
  _rest="${_entry#*:}"
  _rest="${_rest#*:}"
  _rest="${_rest#*:}"
  [ -n "$_rest" ] && [ "$_rest" != "$_entry" ] && echo "$_rest" || echo "neo"
}

get_node_ssh_port() {
  if is_phone_node "$1"; then
    echo "8022"
  else
    echo "22"
  fi
}

is_phone_node() {
  _entry=$(find_node_entry_by_ip "$1" 2>/dev/null || true)
  [ -n "$_entry" ] || return 1
  _rest="${_entry#*:}"
  _rest="${_rest#*:}"
  [ "${_rest%%:*}" = "worker" ]
}

is_pc_node() {
  _entry=$(find_node_entry_by_ip "$1" 2>/dev/null || true)
  [ -n "$_entry" ] || return 1
  _rest="${_entry#*:}"
  _rest="${_rest#*:}"
  _role="${_rest%%:*}"
  [ "$_role" = "pc" ] || [ "$_role" = "control-plane" ]
}

get_node_ssh_user() {
  _entry=$(find_node_entry_by_ip "$1" 2>/dev/null || true)
  if [ -z "$_entry" ]; then
    echo "neo"
    return
  fi

  _rest="${_entry#*:}"
  _rest="${_rest#*:}"
  _role="${_rest%%:*}"
  _user="${_rest#*:}"

  if [ -n "$_user" ] && [ "$_user" != "$_rest" ]; then
    echo "$_user"
  elif [ "$_role" = "worker" ]; then
    echo "u0_a191"
  else
    echo "neo"
  fi
}

resolve_ip_from_config() {
  _entry=$(find_node_entry_by_name "$1" 2>/dev/null || true)
  if [ -n "$_entry" ]; then
    _rest="${_entry#*:}"
    echo "${_rest%%:*}"
  else
    echo "$1"
  fi
}
