<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Curtis Bragdon</title>
  <meta name="description" content="Page not found. Redirecting to Curtis Bragdon's homepage.">
  <meta name="theme-color" content="#ed232a">
  <meta http-equiv="refresh" content="5; url=/">
  <link rel="icon" type="image/png" href="/assets/truck_favicon.png">
  <link rel="apple-touch-icon" href="/assets/truck_favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notfound-container {
      max-width: 500px;
      margin: 2rem;
      padding: 2.5rem;
      text-align: center;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      color: var(--brand);
    }
    h1 i {
      margin-right: 0.5rem;
    }
    p {
      font-size: 1.1rem;
      color: var(--muted);
      margin: 0 0 1.5rem;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      background: var(--brand);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover {
      background: #c91a20;
    }
  </style>
</head>
<body>
  <div class="notfound-container">
    <h1><i class="fa-solid fa-wrench"></i> 404 - Lost in the Tool Truck</h1>
    <p>Sorry, the page you're looking for doesn't exist. Redirecting in <span id="countdown">5</span> seconds...</p>
    <a href="/"><i class="fa-solid fa-home"></i> Return Home Now</a>
  </div>
  <script>
    let count = 5;
    const el = document.getElementById('countdown');
    setInterval(() => {
      count--;
      if (count > 0) el.textContent = count;
    }, 1000);
  </script>
</body>
</html>
