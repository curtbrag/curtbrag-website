name: Deploy Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: f72cbb6e-d6de-4acc-969e-27b0cf4b1c23
      TOKEN_PRIMARY: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      TOKEN_ALT1: ${{ secrets.NETLIFY_TOKEN }}
      TOKEN_ALT2: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
      TOKEN_ALT3: ${{ secrets.NETLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Netlify credential
        id: netlify
        shell: bash
        run: |
          set -euo pipefail
          token="$TOKEN_PRIMARY"
          [ -n "$token" ] || token="$TOKEN_ALT1"
          [ -n "$token" ] || token="$TOKEN_ALT2"
          [ -n "$token" ] || token="$TOKEN_ALT3"
          if [ -n "$token" ]; then
            echo "NETLIFY_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo 'Netlify credential selected'
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'No Netlify API token configured; skipping explicit deploy because Netlify handles repository deploys.'
          fi

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Deploy production to Netlify
        if: steps.netlify.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli deploy \
            --prod \
            --dir=dist \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="GitHub ${GITHUB_SHA}"
