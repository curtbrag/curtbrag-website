name: Stop All Cluster Miners

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-all-miners.yml'

permissions:
  contents: read

jobs:
  stop-miners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEB_PASSWORD: ${{ secrets.CLUSTER_WEB_PASSWORD }}
      CONTROL_API: https://curtbrag.com/.netlify/functions/cluster-api
      SWARM_API: https://curtbrag.com/api/cluster
    steps:
      - name: Verify operator secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEB_PASSWORD" || { echo 'CLUSTER_WEB_PASSWORD secret missing'; exit 1; }

      - name: Best-effort disable desired mining fleet-wide
        continue-on-error: true
        shell: bash
        run: |
          set -u
          curl -sS --retry 2 --retry-delay 1 \
            -H "Authorization: Bearer $WEB_PASSWORD" \
            -H 'Content-Type: application/json' \
            -X POST \
            "$CONTROL_API?action=fleet-disable-mining" \
            --data '{"target":"all"}' | tee /tmp/desired-stop.json || true

      - name: Best-effort queue Windows bridge phone stop
        continue-on-error: true
        shell: bash
        run: |
          set -u
          curl -sS --retry 2 --retry-delay 1 \
            -H "Authorization: Bearer $WEB_PASSWORD" \
            -H 'Content-Type: application/json' \
            -X POST \
            "$CONTROL_API?action=queue-command" \
            --data '{"target":"phones","type":"mining-stop","payload":{"source":"github-stop-all"}}' | tee /tmp/bridge-stop.json || true

      - name: Stop every online canonical Swarm node
        shell: bash
        run: |
          set -euo pipefail
          CANON='["phone173","phone174","phone176","phone177","phone191","phone195","phone253","phone254","Alina","Nexus","SteamDeck","viki"]'
          STATUS="$(curl -fsS --retry 4 --retry-delay 2 -H "Authorization: Bearer $WEB_PASSWORD" "$SWARM_API?action=queue-status&_=$(date +%s%N)")"
          printf '%s\n' "$STATUS" > /tmp/swarm-before.json
          echo '--- swarm before ---'
          printf '%s' "$STATUS" | jq '{nodes_online, nodes:[.nodes[]|{id,online,agent_version,agent_pid}]}'

          TARGETS="$(printf '%s' "$STATUS" | jq -c --argjson canon "$CANON" '[.nodes[] | select(.online == true and (.id as $id | $canon | index($id))) | .id]')"
          COUNT="$(printf '%s' "$TARGETS" | jq 'length')"
          echo "Swarm online canonical targets: $COUNT"
          printf '%s\n' "$TARGETS"
          if [ "$COUNT" -eq 0 ]; then
            echo 'No canonical Swarm nodes online.'
            exit 1
          fi

          JOB="stop-all-$(date +%s)"
          jq -n --arg id "$JOB" --argjson targets "$TARGETS" '{job:{id:$id,type:"mining-stop",cmd:"",command:""},target_device_ids:$targets}' > /tmp/swarm-stop-body.json
          curl -fsS --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer $WEB_PASSWORD" \
            -H 'Content-Type: application/json' \
            -X POST \
            "$SWARM_API?action=enqueue" \
            --data-binary @/tmp/swarm-stop-body.json | tee /tmp/swarm-stop.json
          grep -q '"ok":true' /tmp/swarm-stop.json
          echo "$JOB" > /tmp/stop-job-id

      - name: Wait for stop completion
        shell: bash
        run: |
          set -euo pipefail
          JOB="$(cat /tmp/stop-job-id)"
          for i in $(seq 1 18); do
            sleep 5
            STATUS="$(curl -fsS --retry 2 --retry-delay 1 -H "Authorization: Bearer $WEB_PASSWORD" "$SWARM_API?action=queue-status&_=$(date +%s%N)")"
            printf '%s\n' "$STATUS" > /tmp/swarm-after.json
            PENDING="$(printf '%s' "$STATUS" | jq --arg job "$JOB" '[.assignments[]? | select(.job_id == $job)] | length')"
            RESULTS="$(printf '%s' "$STATUS" | jq --arg job "$JOB" '[.results[]? | select(.job_id == $job)] | length')"
            echo "poll $i: pending=$PENDING results=$RESULTS"
            if [ "$PENDING" -eq 0 ]; then break; fi
          done

          echo '--- stop results ---'
          jq --arg job "$JOB" '[.results[]? | select(.job_id == $job) | {device_id,exit_code,stdout,stderr}]' /tmp/swarm-after.json

          PENDING="$(jq --arg job "$JOB" '[.assignments[]? | select(.job_id == $job)] | length' /tmp/swarm-after.json)"
          FAILS="$(jq --arg job "$JOB" '[.results[]? | select(.job_id == $job and (.exit_code|tonumber) != 0)] | length' /tmp/swarm-after.json)"
          echo "STOP_PENDING=$PENDING"
          echo "STOP_FAILURES=$FAILS"
          test "$PENDING" -eq 0
          test "$FAILS" -eq 0

      - name: Queue mining-status verification
        shell: bash
        run: |
          set -euo pipefail
          CANON='["phone173","phone174","phone176","phone177","phone191","phone195","phone253","phone254","Alina","Nexus","SteamDeck","viki"]'
          STATUS="$(curl -fsS -H "Authorization: Bearer $WEB_PASSWORD" "$SWARM_API?action=queue-status&_=$(date +%s%N)")"
          TARGETS="$(printf '%s' "$STATUS" | jq -c --argjson canon "$CANON" '[.nodes[] | select(.online == true and (.id as $id | $canon | index($id))) | .id]')"
          JOB="verify-stopped-$(date +%s)"
          jq -n --arg id "$JOB" --argjson targets "$TARGETS" '{job:{id:$id,type:"mining-status",cmd:"",command:""},target_device_ids:$targets}' > /tmp/status-body.json
          curl -fsS \
            -H "Authorization: Bearer $WEB_PASSWORD" \
            -H 'Content-Type: application/json' \
            -X POST \
            "$SWARM_API?action=enqueue" \
            --data-binary @/tmp/status-body.json > /tmp/status-enqueue.json
          echo "$JOB" > /tmp/status-job-id

          for i in $(seq 1 12); do
            sleep 5
            SNAP="$(curl -fsS -H "Authorization: Bearer $WEB_PASSWORD" "$SWARM_API?action=queue-status&_=$(date +%s%N)")"
            printf '%s\n' "$SNAP" > /tmp/status-after.json
            PENDING="$(printf '%s' "$SNAP" | jq --arg job "$JOB" '[.assignments[]? | select(.job_id == $job)] | length')"
            echo "verify poll $i: pending=$PENDING"
            if [ "$PENDING" -eq 0 ]; then break; fi
          done

          echo '--- mining status results ---'
          jq --arg job "$JOB" '[.results[]? | select(.job_id == $job) | {device_id,exit_code,stdout,stderr}]' /tmp/status-after.json
