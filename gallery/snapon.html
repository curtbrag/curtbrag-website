<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap-on Gallery - Curtis Bragdon</title>
  <meta name="description" content="Snap-on tools, truck photos, and memories from Curtis Bragdon's franchise.">
  <link rel="icon" type="image/png" href="/assets/truck_favicon.png">
  <link rel="apple-touch-icon" href="/assets/truck_favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--brand), #b91c22);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .header h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    .header p { margin: 0; opacity: 0.9; }
    .nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .nav a:hover, .nav a.active { background: var(--brand); border-color: var(--brand); }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-item:hover { transform: scale(1.02); }
    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a { color: var(--brand); text-decoration: none; }
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 1rem; right: 1.5rem;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--brand);
      border: none;
      color: white;
      width: 50px; height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .lightbox-nav.prev { left: 1rem; }
    .lightbox-nav.next { right: 1rem; }
    .lightbox-counter {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .lightbox-nav { width: 40px; height: 40px; font-size: 1.2rem; }
      .lightbox-nav.prev { left: 0.5rem; }
      .lightbox-nav.next { right: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fa-solid fa-wrench"></i> Snap-on Gallery</h1>
    <p>Tools, truck, and memories</p>
  </div>

  <nav class="nav">
    <a href="/"><i class="fa-solid fa-home"></i> Home</a>
    <a href="/shop"><i class="fa-solid fa-shopping-cart"></i> Card Shop</a>
    <a href="/gallery"><i class="fa-solid fa-images"></i> Gallery</a>
    <a href="/addyourride"><i class="fa-solid fa-car-side"></i> Add Your Ride</a>
  </nav>

  <div class="container">
    <div class="gallery-grid" id="gallery"></div>
  </div>

  <div class="footer">
    <p><a href="/gallery"><i class="fa-solid fa-arrow-left"></i> Back to Gallery</a></p>
    <p>&copy; 2025 Curtis Bragdon. All rights reserved.</p>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
    <button class="lightbox-nav prev" onclick="navLightbox(-1)" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="lightbox-img" src="" alt="Gallery image">
    <button class="lightbox-nav next" onclick="navLightbox(1)" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

      "Mobile uploads.jpg"
    ];

    let currentIndex = 0;
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const counter = document.getElementById('lightbox-counter');

    images.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = `<img src="/gallery/snapon/${img}" alt="Snap-on photo" loading="lazy">`;
      div.onclick = () => openLightbox(i);
      gallery.appendChild(div);
    });

    function updateCounter() {
      counter.textContent = `${currentIndex + 1} / ${images.length}`;
    }

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = `/gallery/snapon/${images[currentIndex]}`;
      updateCounter();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function navLightbox(dir) {
      currentIndex = (currentIndex + dir + images.length) % images.length;
      lightboxImg.src = `/gallery/snapon/${images[currentIndex]}`;
      updateCounter();
    }

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Touch/swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    lightbox.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) navLightbox(1); // swipe left = next
        else navLightbox(-1); // swipe right = prev
      }
    });
  </script>
</body>
</html>
