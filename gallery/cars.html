<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars Gallery - Curtis Bragdon</title>
  <meta name="description" content="Customer cars, trucks, and rides from Curtis Bragdon's Snap-on route around Boston.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, var(--brand), #b91c22);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .header h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    .header p { margin: 0; opacity: 0.9; }
    .nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--text);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .nav a:hover, .nav a.active { background: var(--brand); border-color: var(--brand); }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery-item:hover { transform: scale(1.02); }
    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .cta-box {
      text-align: center;
      padding: 2rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 2rem;
    }
    .cta-box h2 { color: var(--brand); margin: 0 0 0.5rem; }
    .cta-box p { color: var(--muted); margin: 0 0 1rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--brand);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .btn:hover { background: #c91a20; }
    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a { color: var(--brand); text-decoration: none; }
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 1rem; right: 1.5rem;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--brand);
      border: none;
      color: white;
      width: 50px; height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .lightbox-nav.prev { left: 1rem; }
    .lightbox-nav.next { right: 1rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fa-solid fa-car"></i> Cars Gallery</h1>
    <p>Customer rides from around Boston</p>
  </div>

  <nav class="nav">
    <a href="/"><i class="fa-solid fa-home"></i> Home</a>
    <a href="/shop"><i class="fa-solid fa-shopping-cart"></i> Card Shop</a>
    <a href="/gallery"><i class="fa-solid fa-images"></i> Gallery</a>
    <a href="/addyourride"><i class="fa-solid fa-car-side"></i> Add Your Ride</a>
  </nav>

  <div class="container">
    <div class="gallery-grid" id="gallery"></div>

    <div class="cta-box">
      <h2><i class="fa-solid fa-camera"></i> Got a Ride to Share?</h2>
      <p>Submit your car or truck to be featured in the gallery!</p>
      <a href="/addyourride" class="btn"><i class="fa-solid fa-plus"></i> Add Your Ride</a>
    </div>
  </div>

  <div class="footer">
    <p><a href="/gallery"><i class="fa-solid fa-arrow-left"></i> Back to Gallery</a></p>
    <p>&copy; 2025 Curtis Bragdon. All rights reserved.</p>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav prev" onclick="navLightbox(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav next" onclick="navLightbox(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <script>
    const images = [
      "1752533719678_instaPV.jpg","20140328_111738.jpg","20140329_192544.jpg","20180514_152341.jpg",
      "20220624_131902.jpg","20220708_103637.jpg","20220801_174956.jpg","20220809_092556.jpg",
      "20220816_171046.jpg","20220824_112059.jpg","20221019_140336.jpg","20221019_140350.jpg",
      "20221109_131038.jpg","20230117_150153.jpg","20230516_120236.jpg","20231107_165858.jpg",
      "20231207_155538.jpg","20231208_150928.jpg","20231226_095700.jpg","20231226_095705.jpg",
      "20240125_092153.jpg","20240314_165418.jpg","20240606_105032.jpg","20240629_133541.jpg",
      "20240706_152643.jpg","20240916_102348.jpg","20241007_085011.jpg","20241104_115503.jpg",
      "20241104_115506.jpg","20241216_143649.jpg","20250120_115620.jpg","20250221_210600.jpg",
      "20250224_083039.jpg","20250302_113209.jpg","20250323_105042.jpg","20250404_192118.jpg",
      "20250423_161558.jpg","20250705_155712.jpg","20250705_155724.jpg","20250705_155738.jpg",
      "20250705_155748.jpg","20250705_155805.jpg","20250709_152111.jpg","20250714_133543.jpg",
      "20250714_133552.jpg","20250715_205541.jpg","20250715_212944.jpg","FB_IMG_1591014833380.jpg",
      "FB_IMG_1646422731100.jpg","FB_IMG_1646424488729.jpg","FB_IMG_1659571670138.jpg",
      "FB_IMG_1671243979137.jpg","FB_IMG_1671243986990.jpg","FB_IMG_1674071370347.jpg",
      "FB_IMG_1674071377380.jpg","FB_IMG_1686913583477.jpg","FB_IMG_1729455364985.jpg",
      "IMG_20190403_142411.jpg","IMG_20220721_140832.jpg","IMG_20220802_210414_376.jpg",
      "IMG_20230118_132742_685.jpg","IMG_20230624_133214_294.jpg","IMG_20231228_090858.jpg",
      "IMG_20240108_172211.jpg","IMG_20240302_110922.jpg","IMG_20240304_161227.jpg",
      "IMG_20240831_024508.jpg","IMG_20241027_184635.jpg","IMG_20241106_174039.jpg",
      "IMG_20250125_142806.jpg","IMG_20250125_142808.jpg","IMG_20250125_142815.jpg",
      "IMG_20250404_215831_162.jpg","IMG_20250411_184603.jpg","IMG_20250711_164915_755.jpg"
    ];

    let currentIndex = 0;
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    images.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      div.innerHTML = `<img src="/gallery/cars/${img}" alt="Car photo" loading="lazy">`;
      div.onclick = () => openLightbox(i);
      gallery.appendChild(div);
    });

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = `/gallery/cars/${images[currentIndex]}`;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function navLightbox(dir) {
      currentIndex = (currentIndex + dir + images.length) % images.length;
      lightboxImg.src = `/gallery/cars/${images[currentIndex]}`;
    }

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
  </script>
</body>
</html>
