<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Gallery</title>
  <!-- Link the base styles; this file imports the card‑gallery styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="hero">
    <h1>Card Gallery</h1>
    <p>Explore our collection of trading cards.</p>
  </header>
  <main>
    <section class="card-gallery">
      <!--
        Replace the placeholder image filenames (placeholder1.jpg, etc.) with
        your actual card image files. Each figure displays a single trading
        card with a caption. Add or remove <figure> elements as needed.
      -->
      <figure>
        <img src="placeholder1.jpg" alt="Card 1">
        <figcaption>Example Card Title #1</figcaption>
      </figure>
      <figure>
        <img src="placeholder2.jpg" alt="Card 2">
        <figcaption>Example Card Title #2</figcaption>
      </figure>
      <figure>
        <img src="placeholder3.jpg" alt="Card 3">
        <figcaption>Example Card Title #3</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    <p>Some links on this site may be affiliate links. If you purchase through these links, we may earn a commission.</p>
  </footer>
</body>
</html>
