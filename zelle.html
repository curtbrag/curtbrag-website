<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay with Zelle - Curtis Bragdon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #ed232a;
      --bg: #0e0f10;
      --panel: #141517;
      --text: #f5f5f5;
      --muted: #a7a7a7;
      --border: #2a2b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 550px;
      margin: 2rem;
      padding: 2.5rem;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.8rem;
      color: var(--brand);
      text-align: center;
    }
    h1 i {
      margin-right: 0.5rem;
    }
    p {
      font-size: 1rem;
      color: var(--muted);
      margin: 0 0 1rem;
      line-height: 1.6;
    }
    .info-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
    }
    .info-box p {
      margin: 0.5rem 0;
      color: var(--text);
    }
    .info-box strong {
      color: var(--brand);
    }
    .buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.25rem;
      background: var(--brand);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover {
      background: #c91a20;
    }
    a.secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    a.secondary:hover {
      border-color: var(--brand);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-dollar-sign"></i> Send Payment via Zelle</h1>
    <p>To send a payment via Zelle, open your banking app and look for the Zelle option.</p>

    <div class="info-box">
      <p><strong>Phone:</strong> +1 781 417 0692</p>
      <p><strong>Email:</strong> curtis.bragdon@snapon.com</p>
    </div>

    <p>If your banking app doesn't support Zelle, you can learn more at the official Zelle website.</p>

    <div class="buttons">
      <a href="https://www.zellepay.com/" target="_blank"><i class="fa-solid fa-external-link"></i> Visit Zelle</a>
      <a href="/" class="secondary"><i class="fa-solid fa-home"></i> Back Home</a>
    </div>
  </div>
</body>
</html>
